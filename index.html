<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LendTrack – Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body class="auth-body d-flex align-items-center justify-content-center min-vh-100">

  <div class="col-11 col-sm-8 col-md-5 col-lg-4">
    <div class="card shadow-lg border-0 rounded-4">
      <div class="auth-card">
  <div class="text-center mb-4">
    <div class="auth-logo">💰</div>
    <div class="auth-title mt-2">LendTrack</div>
    <div class="auth-subtitle">Track money you've lent to people</div>
  </div>

  <ul class="nav nav-pills nav-fill mb-3" id="authTabs">
    <li class="nav-item">
      <a class="nav-link active" href="#" onclick="showTab('login'); return false;">Login</a>
    </li>
    <li class="nav-item">
      <a class="nav-link" href="#" onclick="showTab('signup'); return false;">Sign Up</a>
    </li>
  </ul>

  <div id="authError" class="alert alert-danger d-none small py-2 mb-3" role="alert"></div>

  <!-- Login Form -->
  <div id="loginForm">
    <div class="mb-3">
      <input type="email" id="loginEmail" class="form-control" placeholder="Email address" aria-label="Email address">
    </div>
    <div class="mb-3">
      <input type="password" id="loginPassword" class="form-control" placeholder="Password" aria-label="Password"
        onkeydown="if(event.key==='Enter') handleLogin()">
    </div>
    <button class="btn btn-primary w-100 mb-3" onclick="handleLogin()">
      <i class="bi bi-box-arrow-in-right" aria-hidden="true"></i> Login
    </button>
  </div>

  <!-- Signup Form -->
  <div id="signupForm" class="d-none">
    <div class="mb-3">
      <input type="text" id="signupName" class="form-control" placeholder="Your name" aria-label="Your name">
    </div>
    <div class="mb-3">
      <input type="email" id="signupEmail" class="form-control" placeholder="Email address" aria-label="Email address">
    </div>
    <div class="mb-3">
      <input type="password" id="signupPassword" class="form-control" placeholder="Password (min 6 chars)" aria-label="Password">
    </div>
    <button class="btn btn-primary w-100 mb-3" onclick="handleSignup()">
      <i class="bi bi-person-plus" aria-hidden="true"></i> Create Account
    </button>
  </div>

  <div class="text-center mb-3" style="font-size:0.75rem;color:var(--text-muted)">— or continue with —</div>

  <button class="btn btn-outline-secondary w-100" onclick="signInWithGoogle()" aria-label="Continue with Google">
    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="16" class="me-2" alt="Google">
    Continue with Google
  </button>
</div>

    </div>
  </div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
  <script>
    auth.onAuthStateChanged(user => { if (user) window.location.href = 'dashboard.html'; });

    function showTab(tab) {
      document.getElementById('loginForm').classList.toggle('d-none', tab !== 'login');
      document.getElementById('signupForm').classList.toggle('d-none', tab !== 'signup');
      document.querySelectorAll('#authTabs .nav-link').forEach((el, i) => {
        el.classList.toggle('active', (i === 0) === (tab === 'login'));
      });
      document.getElementById('authError').classList.add('d-none');
    }

    function handleLogin() {
      signInWithEmail(
        document.getElementById('loginEmail').value,
        document.getElementById('loginPassword').value
      );
    }

    function handleSignup() {
      signUpWithEmail(
        document.getElementById('signupEmail').value,
        document.getElementById('signupPassword').value,
        document.getElementById('signupName').value
      );
    }
  </script>
</body>
</html>
